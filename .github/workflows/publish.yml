name: Package the browser release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smooth64-browser-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the source and shipped movement core
        run: |
          python3 tools/check_vendor.py
          python3 tools/export_animations.py
          git diff --exit-code web/animations.js
          python3 tools/build.py native
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs
      - name: Package the offline game
        run: python3 tools/package_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: smooth64-browser-v0.3.0
          path: dist/
      - name: Publish the third edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create playground-v0.3.0 dist/Smooth64-Browser.zip dist/Smooth64-Play.html \
            --target "$GITHUB_SHA" --title 'Smooth64 — Cinder Caldera' \
            --notes-file docs/releases/v0.3.0.md
